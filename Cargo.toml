[package]
name = "bevy-game-example"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.3", features = ["bevy_remote"] }
avian3d = "0.4.1"
bevy-inspector-egui = "0.35.0"
bevy_rerecast = "0.3.0"
avian_rerecast = "0.3.0"
vleue_navigator = { version = "0.14.0", features = ["avian3d"] }
rand = "0.9.2"
polyanya = { version = "0.15.1", features = ["detailed-layers"] }
bevy_landmass = "0.10.0"
landmass_rerecast = "0.1.0"
nalgebra = "0.34.1"
nalgebra-sparse = "0.11.0"
faer = {version = "0.23", features = ["rayon", "perf-warn"] }

#bevy_dev_tools = "0.17.2"
#bevy_solari = "0.17.2"
#argh = "0.1.13"
#bytemuck = "1.24.0"
#rand = "0.9.2"
#rand_chacha = "0.9.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
